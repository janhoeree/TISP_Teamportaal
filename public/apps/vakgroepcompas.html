<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TISP – Vakgroepkompas</title>
<script src="../js/aanmelding.js"></script>
<style>
:root{color-scheme:light;--bg:#F6F8F7;--card:#fff;--ink:#1B2A41;--mut:#586478;--line:#D6DDD5;--teal:#10A997;--tealink:#147D79;--g:#9EC222;--r:#E94627;--o:#E68311;--b:#1B85E0;
 /* niveaukleuren = huisstijlaccenten (1 rood, 2 oranje, 3 groen, 4 blauw); de -t varianten zijn donkerder voor leesbare tekst */
 --l1:var(--r);--l2:var(--o);--l3:var(--g);--l4:var(--b);
 --l1t:color-mix(in srgb,var(--r) 78%,var(--ink));--l2t:color-mix(in srgb,var(--o) 62%,var(--ink));--l3t:color-mix(in srgb,var(--g) 45%,var(--ink));--l4t:color-mix(in srgb,var(--b) 70%,var(--ink));
 --tint:color-mix(in srgb,var(--tealink) 11%,var(--card));
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;line-height:1.2}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(4px,2px + .6vw,10px) 16px 56px}
/* ===== BANNER (huisstijl) ===== */
.hero{container-type:inline-size}
.hero-in{max-width:1700px;margin:0 auto;--u:min(1cqw,max(10px,calc(10px + (100cqw - 1000px)*.0015)));display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"logo duo" "text duo";grid-template-rows:auto 1fr;column-gap:calc(var(--u)*2);padding:calc(var(--u)*1.2) max(calc(var(--u)*1.5),env(safe-area-inset-right)) max(10px,calc(var(--u)*4)) max(calc(var(--u)*2),env(safe-area-inset-left))}
.logo{grid-area:logo;width:calc(var(--u)*32);max-width:100%;aspect-ratio:1684/468;justify-self:start}
.txt{grid-area:text;align-self:center;padding:0 0 calc(var(--u)*2) calc(var(--u)*7.8);text-align:left}
.txt h1{margin:0 0 var(--u);white-space:nowrap;font-weight:800;font-size:calc(var(--u)*3.6*var(--fit,1));line-height:1.12;color:#0B3B4F}
.txt p{margin:0;white-space:nowrap;font-size:calc(var(--u)*2.3*var(--fit,1));color:var(--tealink)}
.txt p span{color:var(--o)}
.duo{grid-area:duo;align-self:start;display:flex;align-items:flex-end;gap:0}
.paul{height:calc(var(--u)*19);aspect-ratio:2909/3619}.paulien{height:calc(var(--u)*23.8);aspect-ratio:2414/4096;margin-left:calc(var(--u)*-3.5)}
.hero svg,.hero img{display:block;width:100%;height:100%}
/* ===== SLANKE BANNER voor zijpagina's: <header class="hero slim"> =====
   Inhoud even breed als .wrap (max 1000px, 16px zijmarge): titel en figuren lijnen uit met de randen van de vakken.
   Zonder logo. Eén rij: titel + ondertitel (1 kleur) | Paul en Paulien (kleiner). Zelfde --u-schaal als de grote banner.
   Op smalle banners (<= 640px) blijven tekst en figuren op 1 rij; de ondertitel mag dan over 2 lijnen lopen. */
.hero.slim .hero-in{max-width:1000px;padding-left:16px;padding-right:16px;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"text duo";grid-template-rows:auto;align-items:center;column-gap:calc(var(--u)*2.5);padding-top:calc(var(--u)*1);padding-bottom:calc(var(--u)*1.2)}
.hero.slim .txt{padding:0}
.hero.slim .txt h1{font-size:calc(var(--u)*3.2*var(--fit,1));margin:0 0 calc(var(--u)*.5)}
.hero.slim .txt p{font-size:calc(var(--u)*1.9*var(--fit,1))}
.hero.slim .duo{align-self:end}
.hero.slim .paul{height:calc(var(--u)*10.5)}
.hero.slim .paulien{height:calc(var(--u)*13);margin-left:calc(var(--u)*-2)}
@container (max-width:640px){
 .hero.slim .paul{height:calc(var(--u)*11)}.hero.slim .paulien{height:calc(var(--u)*14)}
 .hero.slim .txt h1{font-size:calc(var(--u)*4.6*var(--fit,1))}
 .hero.slim .txt p{font-size:calc(var(--u)*3.2*var(--fit,1));white-space:normal}
}
/* ===== KAARTEN EN TEKST ===== */
main{padding-top:0}
.card{background:color-mix(in srgb,var(--tealink) 6%,var(--card));border:1px solid var(--tealink);border-top:5px solid var(--tealink);border-radius:12px;padding:clamp(12px,8px + 1vw,18px);margin-bottom:clamp(10px,6px + .6vw,16px)}
h2{font:700 clamp(16px,12px + 1.1vw,20px) system-ui,sans-serif;margin-bottom:6px}
h3{font:700 clamp(15px,12px + .9vw,18px) system-ui,sans-serif}
.mut{color:var(--mut);margin:4px 0 12px}
/* werkbalk bovenaan: terugkeerlink, modus, naam/schooljaar, tabs */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{color:var(--tealink);font-weight:600;text-decoration:none}.back:hover{text-decoration:underline}
.id{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 12px}
.id input{min-width:0;flex:1 1 200px}
.id .status{flex-basis:100%}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:6px}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 10px;font:600 16px system-ui,sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:var(--ink)}nav button.on{color:var(--tealink);border-color:var(--teal)}
/* niveaus */
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.l{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.l b{font-size:14px}.l span{font-size:13.5px;color:var(--mut);line-height:1.35}
.l:hover{border-color:var(--mut)}
.l1.on{border-color:var(--l1);background:color-mix(in srgb,var(--l1) 14%,var(--card))}
.l2.on{border-color:var(--l2);background:color-mix(in srgb,var(--l2) 14%,var(--card))}
.l3.on{border-color:var(--l3);background:color-mix(in srgb,var(--l3) 14%,var(--card))}
.l4.on{border-color:var(--l4);background:color-mix(in srgb,var(--l4) 14%,var(--card))}
.l1 b{color:var(--l1t)}.l2 b{color:var(--l2t)}.l3 b{color:var(--l3t)}.l4 b{color:var(--l4t)}
:focus-visible{outline:3px solid var(--b);outline-offset:3px}
.tips{margin-top:12px;background:var(--tint);border-radius:12px;padding:12px 14px;font-size:15px}
.tips ul{margin:6px 0 10px;padding-left:20px}
/* knoppen */
.btn{background:var(--tealink);color:#fff;border:0;border-radius:12px;padding:9px 14px;font:600 15px system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:none;color:var(--tealink);border:1.5px solid var(--tealink)}
/* balken */
.bars{display:grid;grid-template-columns:minmax(120px,230px) 1fr 24px;gap:8px 10px;align-items:center;font-size:15px}
.track{height:12px;background:var(--tint);border-radius:6px;overflow:hidden}.track i{display:block;height:100%;border-radius:6px}
/* formulieren */
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=date],.id input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.id input{width:auto}
textarea{min-height:76px;resize:vertical}
.ac{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:10px;align-items:start}
.late{color:var(--l1t);font-weight:600;font-size:14px}
.dl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:720px){.lv{grid-template-columns:1fr 1fr}.ac{grid-template-columns:1fr 1fr}.ac>:first-child{grid-column:1/-1}.pd{grid-template-columns:1fr}}
@media (max-width:420px){.lv{grid-template-columns:1fr}}
.do{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-weight:400;font-size:16px;margin:0}
.do input{width:20px;height:20px;margin-top:3px;accent-color:var(--tealink);flex:none}
.sub{margin:2px 0 12px 30px;padding:2px 12px 12px;background:var(--tint);border-radius:12px}
.pl{background:var(--tint);padding:10px 12px;border-radius:12px}
/* overzicht directie */
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,6px + .6vw,14px);margin-bottom:clamp(10px,6px + .6vw,16px)}
.st{margin:0;padding:14px}.st b{display:block;font:800 26px system-ui,sans-serif}.st span{color:var(--mut);font-size:14px}
.dt{width:100%;border-collapse:collapse;font-size:15px}.dt th{text-align:center;padding:8px 6px;color:var(--mut);font-size:13px;border-bottom:2px solid var(--line)}.dt th:first-child,.dt th:last-child{text-align:left}
.dt td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}.dt td:first-child,.dt td:last-child{text-align:left;white-space:nowrap}
.nm{background:none;border:0;padding:0;font:600 16px system-ui,sans-serif;color:var(--ink);cursor:pointer;text-decoration:underline dotted}
.c{display:inline-block;min-width:30px;padding:3px 0;border-radius:8px;font-weight:700}.c0{color:var(--mut)}
.c1{background:color-mix(in srgb,var(--l1) 18%,var(--card));color:var(--l1t)}.c2{background:color-mix(in srgb,var(--l2) 18%,var(--card));color:var(--l2t)}.c3{background:color-mix(in srgb,var(--l3) 18%,var(--card));color:var(--l3t)}.c4{background:color-mix(in srgb,var(--l4) 18%,var(--card));color:var(--l4t)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.dot.l1{background:var(--l1)}.dot.l2{background:var(--l2)}.dot.l3{background:var(--l3)}.dot.gr{background:var(--mut)}
.sm{font-size:13.5px;margin:0}
.dt td.det{text-align:left;white-space:normal;background:var(--tint)}
@media (max-width:720px){.sts{grid-template-columns:1fr 1fr}}
.nd{grid-column:1/-1}.nd textarea{margin:4px 0 0 30px;width:calc(100% - 30px)}
.need{border:1px solid var(--line);border-left:4px solid var(--l2);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card)}.need.u{border-left-color:var(--l1)}.need.dn{opacity:.65;border-left-color:var(--l3)}
.nh{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}.nt{margin:6px 0;white-space:pre-wrap}
@media print{.hero,.back,nav,.btn,.tips{display:none}.id input{border-color:#999}}
</style></head><body>
<header class="hero slim"><div class="hero-in">
  <div class="txt"><h1>Vakgroepkompas</h1><p>Schaal je vakgroep in, kies doelen en plan acties.</p></div>
  <div class="duo">
   <div class="paul" data-afbeelding="paul"></div>
   <div class="paulien" data-afbeelding="paulien"></div>
  </div>
 </div></header>
<div class="wrap">
 <div class="card bar">
  <div class="top"><a class="back" href="../teamportaal.html">← Terug naar het teamportaal</a></div>
  <div class="id"><input data-f="name" id="n" placeholder="Naam vakgroep (bv. Wiskunde)" aria-label="Naam vakgroep"><input data-f="year" id="y" placeholder="Schooljaar" aria-label="Schooljaar"><p class="mut sm status" id="opslagStatus" aria-live="polite"></p></div>
  <nav id="nav"></nav>
 </div>
 <main id="app"></main>
</div>
<script src="../js/opslag.js"></script>
<script src="../js/vakgroepcompas_onderdelen.js"></script>
<script>
let S=Onderdelen.STANDAARD; // wordt bij de start vervangen door de aangepaste lijst (zie js/vakgroepcompas_onderdelen.js)
const LV=['Start','Basis','Volgens verwachting','Voorbeeld'],TABS=['1. Inschalen','2. Prioriteiten','3. Actieplan','4. Reflectie'];
const TODAY=new Date().toISOString().slice(0,10);
/* ===== BEWAREN =====
   Alles wordt automatisch bewaard via opslag.js, per vakgroep in een eigen bestand (bv. vakgroep-wiskunde).
   De browser onthoudt alleen welke vakgroep je laatst open had. */
const leeg=name=>({name,year:'2026-2027',sc:{},pr:[nieuwePrio()],ac:[]});
function nieuwePrio(){return {k:'',doel:'',zelf:false,why:''}}
let st=leeg('');
let tab=0,bewaarT=null;
const slug=n=>String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const sleutel=n=>'vakgroep-'+slug(n);
const status=t=>{document.getElementById('opslagStatus').textContent=t};
const nietBewaard='Niet bewaard: de server draait niet. Start het portaal met start.bat.';
const save=()=>{st.updated=Date.now();if(!slug(st.name)){status('Vul de naam van de vakgroep in om automatisch te bewaren.');return}
 const k=sleutel(st.name),data=st;clearTimeout(bewaarT);status('Bezig met bewaren…');
 bewaarT=setTimeout(async()=>{try{await Opslag.bewaar(k,data);status('Automatisch bewaard om '+new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}))}catch(e){status(nietBewaard)}},500)};
async function kiesVakgroep(start){const naam=st.name;try{localStorage.setItem('vkk-naam',naam)}catch(e){}
 if(!slug(naam)){save();return}
 let x;try{x=await Opslag.laad(sleutel(naam))}catch(e){status(nietBewaard);return}
 if(x&&ok(x)){st=clean(x);if(!st.pr.length)st.pr.push(nieuwePrio());vulVelden();render();status('Gegevens van '+st.name+' geladen.')}
 else if(start)status('Nog niets bewaard voor '+naam+'.');else save()}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sObj=k=>S.find(s=>s.t==k);
const fmt=d=>d?d.split('-').reverse().join('/'):'geen datum';

function vIns(){
 const done=Object.keys(st.sc).length;
 return `<div class="card"><h2>Schaal jullie vakgroep in</h2><p class="mut">Kies per onderdeel het niveau dat het best bij jullie praktijk past. Niveau 3 is de kwaliteitsverwachting. ${done} van ${S.length} ingeschaald.</p>
 <div class="bars">${S.map(s=>{const v=st.sc[s.t]||0;return `<span>${esc(s.t)}</span><div class="track"><i style="width:${v*25}%;background:var(--l${v||1})"></i></div><b>${v||'–'}</b>`}).join('')}</div></div>`+
 S.map(s=>{const v=st.sc[s.t];return `<section class="card"><h3>${esc(s.t)}</h3><p class="mut">${esc(s.d)}</p><div class="lv">${s.l.map((x,i)=>`<button class="l l${i+1}${v==i+1?' on':''}" data-k="${esc(s.t)}" data-v="${i+1}" aria-pressed="${v==i+1}"><b>${i+1} · ${LV[i]}</b><span>${esc(x)}</span></button>`).join('')}</div>
 ${v&&v<4?`<div class="tips"><b>Zo groei je naar niveau ${v+1} (${LV[v]})</b>${s.tp[v-1].length?`<ul>${s.tp[v-1].map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="mut" style="margin:6px 0 10px">Nog geen tips.</p>'}<button class="btn ghost" data-prio="${esc(s.t)}">Maak er een prioriteit van</button></div>`:v==4?`<div class="tips"><b>Niveau 4 bereikt</b><p style="margin:6px 0 0">Borg wat werkt en deel het met andere vakgroepen.</p></div>`:''}</section>`}).join('')}
function vPrio(){
 return `<div class="card"><h2>Kies hier je prioriteiten</h2><p class="mut">Schaal eerst in om te zien waar de grootste groeikansen liggen. Kies wat de meeste impact heeft op het leren en haalbaar is.</p></div>`+
 st.pr.map(vPrioriteit).join('')+
 `<div class="card"><button class="btn" data-addprio="1">Prioriteit toevoegen</button></div>`}
/* Het doel kies je uit de tips om te groeien naar het volgende niveau (volgens de inschaling),
   of je schrijft het in het tekstvak: dan springt de keuzelijst op "We formuleren zelf een doel". */
const ZELF='We formuleren zelf een doel';
const prioTips=p=>{const s=sObj(p.k),v=s&&st.sc[s.t];return s&&v&&v<4?s.tp[v-1]:[]};
const eigenDoel=p=>p.zelf||(!!p.doel&&!prioTips(p).includes(p.doel));
function vPrioriteit(p,i){
 const tips=prioTips(p),zelf=eigenDoel(p);
 return `<section class="card"><div class="dl" style="border:0;padding:0;align-items:center"><h3 style="margin:0">Prioriteit ${i+1}</h3>${st.pr.length>1?`<button class="btn ghost" data-delprio="${i}">Verwijderen</button>`:''}</div>
 <label for="pk${i}">Onderdeel</label><select id="pk${i}" data-f="pr.${i}.k" data-r="1"><option value="">Kies een onderdeel</option>${S.map(s=>`<option value="${esc(s.t)}"${p.k==s.t?' selected':''}>${esc(s.t)}${st.sc[s.t]?' – niveau '+st.sc[s.t]:''}</option>`).join('')}</select>
 <label for="pd${i}">Doel</label><p class="mut sm" style="margin:0 0 4px">Kies hieronder een doel uit de tips of formuleer zelf een doel</p>
 <select id="pd${i}" data-doel="${i}"><option value="">${p.k?'Kies een doel':'Kies eerst een onderdeel'}</option>${tips.map((t,j)=>`<option value="${j}"${!zelf&&p.doel==t?' selected':''}>${esc(t)}</option>`).join('')}<option value="zelf"${zelf?' selected':''}>${ZELF}</option></select>
 <textarea id="pz${i}" data-f="pr.${i}.doel" data-eigen="${i}" aria-label="Ons eigen doel" placeholder="Of formuleer hier zelf een doel: wat willen we bereiken?" style="margin-top:8px">${zelf?esc(p.doel):''}</textarea>
 <label for="pw${i}">Waarom is dit belangrijk?</label><textarea id="pw${i}" data-f="pr.${i}.why">${esc(p.why)}</textarea>
 <button class="btn" id="pg${i}" data-naarac="${i}" style="margin-top:12px"${volledig(p)?'':' hidden'}>Ga verder naar het actieplan</button></section>`}
/* De knop naar het actieplan verschijnt zodra onderdeel, doel en "waarom" ingevuld zijn. */
const volledig=p=>!!(p.k&&p.doel.trim()&&p.why.trim());
function vAct(){
 const ps=st.pr.map((p,i)=>({p,i})).filter(x=>x.p.k);
 if(!ps.length)return `<div class="card"><h2>Actieplan</h2><p class="mut">Kies eerst een prioriteit.</p><button class="btn" data-go="1">Naar prioriteiten</button></div>`;
 const all=st.ac.filter(a=>a.status!='Klaar').sort((a,b)=>(a.datum||'9').localeCompare(b.datum||'9'));
 return `<div class="card"><h2>Deadlines</h2>${all.length?all.map(a=>`<div class="dl"><span>${esc(a.tekst||'(nog niet ingevuld)')}</span><span class="${a.datum&&a.datum<TODAY?'late':''}">${fmt(a.datum)}${a.datum&&a.datum<TODAY?' · te laat':''}</span></div>`).join(''):'<p class="mut">Geen openstaande acties.</p>'}</div>`+
 ps.map(({p,i})=>`<section class="card" id="ap${i}"><h3>${esc(sObj(p.k).t)}</h3><p class="mut">Formuleer SMART: wat doen we precies, hoe meten we het, tegen wanneer?</p>
 ${st.ac.filter(a=>a.p==i).map(a=>`<div class="ac"><textarea data-f="ac.${a.id}.tekst" aria-label="Actie" placeholder="Actie en meetbaar resultaat">${esc(a.tekst)}</textarea><input type="text" data-f="ac.${a.id}.wie" value="${esc(a.wie)}" placeholder="Wie?" aria-label="Verantwoordelijke"><input type="date" data-f="ac.${a.id}.datum" data-r="1" value="${a.datum}" aria-label="Deadline"><select data-f="ac.${a.id}.status" data-r="1" aria-label="Status">${['Open','Bezig','Klaar'].map(o=>`<option${a.status==o?' selected':''}>${o}</option>`).join('')}</select><button class="btn ghost" data-del="${a.id}" aria-label="Verwijder actie">✕</button><div class="nd"><label class="do"><input type="checkbox" data-need="${a.id}"${a.need?' checked':''}><span>Ik heb hier iets van de directie voor nodig <span class="mut">(optioneel)</span></span></label>${a.need?`<textarea data-f="ac.${a.id}.needTxt" aria-label="Wat heb je nodig van de directie en waarom?" placeholder="Wat is er nodig en waarom helpt dat om het doel te bereiken?">${esc(a.needTxt)}</textarea>`:''}</div></div>`).join('')}
 <button class="btn" data-add="${i}">Actie toevoegen</button></section>`).join('')}
function vRef(){
 const ps=st.pr.map((p,i)=>({p,i})).filter(x=>x.p.k);
 const head=`<div class="card"><h2>Reflectie op de PDCA-cyclus</h2><p class="mut">Plan en Do komen uit het actieplan. Vink een actie af als ze uitgevoerd is: daarna verschijnen Check en Act voor die actie.</p><button class="btn" onclick="window.print()">Print of bewaar als PDF</button></div>`;
 if(!ps.length)return head+`<div class="card"><p class="mut">Kies eerst een prioriteit en maak een actieplan.</p><button class="btn" data-go="1">Naar prioriteiten</button></div>`;
 return head+ps.map(({p,i})=>{
  const acs=st.ac.filter(a=>a.p==i),n=acs.filter(a=>a.status=='Klaar').length;
  return `<section class="card"><h3>${esc(sObj(p.k).t)}</h3>
  <label>PLAN: welke doelstelling hebben we gekozen?</label><div class="pl">${p.doel?esc(p.doel):'<span class="mut">Nog geen doel ingevuld bij de prioriteiten.</span>'}${p.why?`<div class="mut" style="margin:6px 0 0">Waarom: ${esc(p.why)}</div>`:''}</div>
  <label>DO: wat hebben we concreet uitgevoerd? (${n} van ${acs.length} voldaan)</label>
  ${acs.length?acs.map(a=>{const ok=a.status=='Klaar';return `<label class="do"><input type="checkbox" data-chk="${a.id}"${ok?' checked':''}><span>${esc(a.tekst||'(actie zonder omschrijving)')}<span class="mut"> · ${esc(a.wie||'geen verantwoordelijke')} · ${fmt(a.datum)}</span></span></label>
  ${ok?`<div class="sub"><label for="c${a.id}">CHECK: wat tonen de resultaten, observaties en ervaringen?</label><textarea id="c${a.id}" data-f="ac.${a.id}.check">${esc(a.check)}</textarea><label for="a${a.id}">ACT: wat gaan we borgen of aanpassen?</label><textarea id="a${a.id}" data-f="ac.${a.id}.act">${esc(a.act)}</textarea></div>`:''}`}).join(''):`<p class="mut">Nog geen acties.</p><button class="btn ghost" data-go="2">Naar actieplan</button>`}
  </section>`}).join('')}
function render(){
 $nav.innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" data-t="${i}">${t}</button>`).join('');
 $app.innerHTML=[vIns,vPrio,vAct,vRef][tab]();
}
const $nav=document.getElementById('nav'),$app=document.getElementById('app');
const vulVelden=()=>{document.getElementById('n').value=st.name;document.getElementById('y').value=st.year};
function setf(f,v){if(f=='name'||f=='year'){st[f]=v;return}const p=f.split('.');
 if(p[0]=='ac')st.ac.find(x=>x.id==p[1])[p[2]]=v;else if(p[0]=='pr')st.pr[p[1]][p[2]]=v;else st[p[0]]=v;save()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t!=null){tab=+d.t}
 else if(d.v){st.sc[d.k]=+d.v;save();const y=scrollY;render();scrollTo(0,y);return}
 else if(d.prio){let i=st.pr.findIndex(p=>p.k==d.prio);if(i<0)i=st.pr.findIndex(p=>!p.k);if(i<0)i=st.pr.push(nieuwePrio())-1;st.pr[i].k=d.prio;save();tab=1}
 else if(d.naarac){tab=2;render();document.getElementById('ap'+d.naarac).scrollIntoView({block:'start'});return}
 else if(d.addprio){st.pr.push(nieuwePrio());save();render();document.getElementById('pk'+(st.pr.length-1)).focus();return}
 else if(d.delprio){const i=+d.delprio,n=st.ac.filter(a=>a.p==i).length;
  if(!confirm(`Prioriteit ${i+1} verwijderen?`+(n?` De ${n} actie(s) bij deze prioriteit worden ook verwijderd.`:'')))return;
  st.pr.splice(i,1);st.ac=st.ac.filter(a=>a.p!=i);st.ac.forEach(a=>{if(a.p>i)a.p--});save()}
 else if(d.go){tab=+d.go}
 else if(d.add!=null){st.ac.push({id:Date.now(),p:+d.add,tekst:'',wie:'',datum:'',status:'Open'});save()}
 else if(d.del){st.ac=st.ac.filter(a=>a.id!=d.del);save()}
 else return;
 render();if(d.t!=null||d.prio||d.go)scrollTo(0,0)});
document.addEventListener('input',e=>{const f=e.target.dataset.f,eg=e.target.dataset.eigen;
 if(eg!=null){st.pr[eg].zelf=true;document.getElementById('pd'+eg).value='zelf'}
 if(f&&!e.target.dataset.r){setf(f,e.target.value);
 if(f.startsWith('pr.')){const i=f.split('.')[1];document.getElementById('pg'+i).hidden=!volledig(st.pr[i])}}});
document.addEventListener('change',e=>{const f0=e.target.dataset.f;if(f0=='name'){kiesVakgroep();return}if(f0=='year'){save();return}const nd=e.target.dataset.need;if(nd){const a=st.ac.find(x=>x.id==nd);a.need=e.target.checked;save();const y=scrollY;render();scrollTo(0,y);return}const c=e.target.dataset.chk;if(c){const a=st.ac.find(x=>x.id==c);a.status=e.target.checked?'Klaar':'Open';save();const y=scrollY;render();scrollTo(0,y);return}const dl=e.target.dataset.doel;if(dl!=null){const p=st.pr[dl],w=e.target.value;
 if(w=='zelf'){if(!eigenDoel(p)){p.zelf=true;p.doel=''}save();render();document.getElementById('pz'+dl).focus();return}
 if(eigenDoel(p)&&p.doel.trim()&&!confirm('Weet je zeker dat je je eigen doel wilt overschrijven?')){e.target.value='zelf';return}
 p.zelf=false;p.doel=w===''?'':prioTips(p)[w];save();render();return}
 const f=e.target.dataset.f;if(f&&e.target.dataset.r){setf(f,e.target.value);if(/^pr\.\d+\.k$/.test(f)){const p=st.pr[f.split('.')[1]];if(!p.zelf)p.doel=''}render()}});
const clean=o=>({name:String(o.name),year:String(o.year||''),updated:+o.updated||0,
 sc:Object.fromEntries(Object.entries(o.sc||{}).filter(([k,v])=>v>=1&&v<=4)),
 pr:(Array.isArray(o.pr)?o.pr:[]).map(p=>({k:sObj(p&&p.k)?p.k:'',doel:String(p&&p.doel||''),zelf:!!(p&&p.zelf),why:String(p&&p.why||'')})),
 ac:(Array.isArray(o.ac)?o.ac:[]).map(a=>({id:a.id,p:+a.p||0,tekst:String(a.tekst||''),wie:String(a.wie||''),datum:String(a.datum||''),status:['Open','Bezig','Klaar'].includes(a.status)?a.status:'Open',need:!!a.need,needTxt:String(a.needTxt||''),check:String(a.check||''),act:String(a.act||'')}))});
const ok=o=>o&&typeof o=='object'&&o.name&&typeof o.sc=='object';

/* ===== HUISSTIJL: AFBEELDINGEN =====
   De tekeningen staan als aparte SVG-bestanden naast deze html (map afbeeldingen/, naast de map apps/).
   Een lege alt ("") = decoratieve afbeelding (verborgen voor schermlezers). */
const AFBEELDINGEN={
 logo:   {src:'../afbeeldingen/logo.svg',    alt:'KSOM Campus Sint-Paulus – Klaar voor de toekomst!'},
 paul:   {src:'../afbeeldingen/paul.svg',    alt:''},
 paulien:{src:'../afbeeldingen/paulien.svg', alt:''}
};
function laadAfbeeldingen(){
 document.querySelectorAll('[data-afbeelding]').forEach(el=>{
  const a=AFBEELDINGEN[el.dataset.afbeelding];
  if(!a)return;
  const img=new Image();
  img.src=a.src;img.alt=a.alt;img.decoding='async';
  if(!a.alt)img.setAttribute('aria-hidden','true');
  el.appendChild(img);
 });
}
/* ===== HUISSTIJL: TEKST OP 1 LIJN =====
   Is het lettertype op een toestel breder dan verwacht, dan verkleint deze functie titel en ondertitel
   samen net genoeg (--fit) zodat ze op 1 lijn blijven. */
function pasTekstAan(){
 const txt=document.querySelector('.txt');
 txt.style.removeProperty('--fit');
 const cs=getComputedStyle(txt),beschikbaar=txt.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
 const breedte=el=>{const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width};
 const nodig=Math.max(...[...txt.children].map(breedte));
 if(nodig>beschikbaar)txt.style.setProperty('--fit',(beschikbaar/nodig*0.98).toFixed(3));
}
laadAfbeeldingen();
pasTekstAan();
new ResizeObserver(pasTekstAan).observe(document.querySelector('.hero'));
if(document.fonts)document.fonts.ready.then(pasTekstAan);
</script></body></html>
