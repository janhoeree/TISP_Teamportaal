<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vakgroepbeheer – TISP teamportaal</title>
<script src="../js/aanmelding.js" data-recht="vakgroep-koppelen"></script>
<script src="../js/vakgroepcompas_tabs.js" defer></script>
<style>
:root{color-scheme:light;--bg:#F6F8F7;--card:#fff;--ink:#1B2A41;--mut:#586478;--line:#D6DDD5;--teal:#10A997;--tealink:#147D79;--g:#9EC222;--r:#E94627;--o:#E68311;--b:#1B85E0;
 /* niveaukleuren = huisstijlaccenten (1 rood, 2 oranje, 3 groen, 4 blauw); de -t varianten zijn donkerder voor leesbare tekst */
 --l1:var(--r);--l2:var(--o);--l3:var(--g);--l4:var(--b);
 --l1t:color-mix(in srgb,var(--r) 78%,var(--ink));--l2t:color-mix(in srgb,var(--o) 62%,var(--ink));--l3t:color-mix(in srgb,var(--g) 45%,var(--ink));--l4t:color-mix(in srgb,var(--b) 70%,var(--ink));
 --tint:color-mix(in srgb,var(--tealink) 11%,var(--card));
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;line-height:1.2}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(4px,2px + .6vw,10px) 16px 56px}
/* ===== BANNER (huisstijl) ===== */
.hero{container-type:inline-size}
.hero-in{max-width:1700px;margin:0 auto;--u:min(1cqw,max(10px,calc(10px + (100cqw - 1000px)*.0015)));display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"logo duo" "text duo";grid-template-rows:auto 1fr;column-gap:calc(var(--u)*2);padding:calc(var(--u)*1.2) max(calc(var(--u)*1.5),env(safe-area-inset-right)) max(10px,calc(var(--u)*4)) max(calc(var(--u)*2),env(safe-area-inset-left))}
.logo{grid-area:logo;width:calc(var(--u)*32);max-width:100%;aspect-ratio:1684/468;justify-self:start}
.txt{grid-area:text;align-self:center;padding:0 0 calc(var(--u)*2) calc(var(--u)*7.8);text-align:left}
.txt h1{margin:0 0 var(--u);white-space:nowrap;font-weight:800;font-size:calc(var(--u)*3.6*var(--fit,1));line-height:1.12;color:#0B3B4F}
.txt p{margin:0;white-space:nowrap;font-size:calc(var(--u)*2.3*var(--fit,1));color:var(--tealink)}
.txt p span{color:var(--o)}
.duo{grid-area:duo;align-self:start;display:flex;align-items:flex-end;gap:0}
.paul{height:calc(var(--u)*19);aspect-ratio:2909/3619}.paulien{height:calc(var(--u)*23.8);aspect-ratio:2414/4096;margin-left:calc(var(--u)*-3.5)}
.hero svg,.hero img{display:block;width:100%;height:100%}
/* ===== SLANKE BANNER voor zijpagina's: <header class="hero slim"> =====
   Inhoud even breed als .wrap (max 1000px, 16px zijmarge): titel en figuren lijnen uit met de randen van de vakken.
   Zonder logo. Eén rij: titel + ondertitel (1 kleur) | Paul en Paulien (kleiner). Zelfde --u-schaal als de grote banner.
   Op smalle banners (<= 640px) blijven tekst en figuren op 1 rij; de ondertitel mag dan over 2 lijnen lopen. */
.hero.slim .hero-in{max-width:1000px;padding-left:16px;padding-right:16px;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"text duo";grid-template-rows:auto;align-items:center;column-gap:calc(var(--u)*2.5);padding-top:calc(var(--u)*1);padding-bottom:calc(var(--u)*1.2)}
.hero.slim .txt{padding:0}
.hero.slim .txt h1{font-size:calc(var(--u)*3.2*var(--fit,1));margin:0 0 calc(var(--u)*.5)}
.hero.slim .txt p{font-size:calc(var(--u)*1.9*var(--fit,1))}
.hero.slim .duo{align-self:end}
.hero.slim .paul{height:calc(var(--u)*10.5)}
.hero.slim .paulien{height:calc(var(--u)*13);margin-left:calc(var(--u)*-2)}
@container (max-width:640px){
 .hero.slim .paul{height:calc(var(--u)*11)}.hero.slim .paulien{height:calc(var(--u)*14)}
 .hero.slim .txt h1{font-size:calc(var(--u)*4.6*var(--fit,1))}
 .hero.slim .txt p{font-size:calc(var(--u)*3.2*var(--fit,1));white-space:normal}
}
/* ===== KAARTEN EN TEKST ===== */
main{padding-top:0}
.card{background:color-mix(in srgb,var(--tealink) 6%,var(--card));border:1px solid var(--tealink);border-top:5px solid var(--tealink);border-radius:12px;padding:clamp(12px,8px + 1vw,18px);margin-bottom:clamp(10px,6px + .6vw,16px)}
h2{font:700 clamp(16px,12px + 1.1vw,20px) system-ui,sans-serif;margin-bottom:6px}
h3{font:700 clamp(15px,12px + .9vw,18px) system-ui,sans-serif}
.mut{color:var(--mut);margin:4px 0 12px}
/* werkbalk bovenaan: terugkeerlink, modus, naam/schooljaar, tabs */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{color:var(--tealink);font-weight:600;text-decoration:none}.back:hover{text-decoration:underline}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:6px}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 10px;font:600 16px system-ui,sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:var(--ink)}nav button.on{color:var(--tealink);border-color:var(--teal)}
:focus-visible{outline:3px solid var(--b);outline-offset:3px}
/* knoppen en formulieren */
.btn{background:var(--tealink);color:#fff;border:0;border-radius:12px;padding:9px 14px;font:600 15px system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:none;color:var(--tealink);border:1.5px solid var(--tealink)}
.btn.klein{padding:6px 10px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=date],.id input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.id input{width:auto}
/* ===== GEBRUIKERS ===== */
.lid{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.nm2{flex:1;font-weight:600}.rol{font-weight:400;color:var(--mut)}
.lid label{margin:0;display:flex;align-items:center;gap:6px;font-size:14px}
.lid input[type=checkbox]{width:18px;height:18px;accent-color:var(--tealink)}
.x2{flex:none;background:none;border:1.5px solid var(--line);border-radius:8px;width:34px;height:34px;font-size:18px;color:var(--mut);cursor:pointer}.x2:hover{color:var(--r);border-color:var(--r)}
.sug{border:1.5px solid var(--line);border-radius:8px;background:var(--card);margin-top:4px;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 12px;font:inherit;color:var(--ink);cursor:pointer}
.sug button:hover,.sug button:focus{background:var(--tint)}
.sug p{margin:0;padding:7px 12px;color:var(--mut)}
.sm{font-size:13.5px}
.uitleg{font-size:13.5px;color:var(--mut);margin:0 0 6px}
@media (max-width:560px){.lid{flex-wrap:wrap}}
</style></head><body>
<header class="hero slim"><div class="hero-in">
  <div class="txt"><h1>Vakgroepbeheer</h1><p>Voeg leraren toe aan je vakgroep of koppel ze los.</p></div>
  <div class="duo">
   <div class="paul" data-afbeelding="paul"></div>
   <div class="paulien" data-afbeelding="paulien"></div>
  </div>
 </div></header>
<div class="wrap">
 <div class="card bar">
  <div class="top"><a class="back" href="../teamportaal.html">← Terug naar het teamportaal</a><p class="mut sm status" id="opslagStatus" aria-live="polite" style="margin:0"></p></div>
 </div>
 <main id="app"></main>
</div>
<script>
/* ===== MODULE 1: SERVER =====
   De pagina praat rechtstreeks met de server (server/gebruikers.js):
     GET /api/gebruikers, PUT /api/gebruikers/<id>, GET /api/vakgroepen
   De server beslist wat je mag; deze pagina toont alleen wat bij jouw rechten past. */
async function api(methode,pad,inhoud){
 const r=await fetch('/api/'+pad,{method:methode,cache:'no-store',headers:inhoud?{'Content-Type':'application/json'}:{},body:inhoud?JSON.stringify(inhoud):undefined});
 const data=await r.json().catch(()=>null);
 if(!r.ok)throw new Error((data&&data.fout)||'De server antwoordt niet ('+r.status+')');
 return data;
}
const statusEl=document.getElementById('opslagStatus');
const status=t=>{statusEl.textContent=t};
const bewaard=()=>status('Automatisch bewaard om '+new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}));

/* ===== MODULE 2: GEGEVENS =====
   Een vakgroephoofd ziet alleen de vakgroepen waarvan hij hoofd is. Hij kan leraren toevoegen en loskoppelen,
   maar geen ander vakgroephoofd loskoppelen.
   Directie en beheerder (recht gebruikers-beheer) zien alle vakgroepen en duiden ook het vakgroephoofd aan.
   Rollen, tegels en de lijst van vakgroepen beheer je op gebruikersbeheer.html. */
let beheer=false,gebruikers=[],vakgroepen=[],keuze='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opNaam=(a,b)=>a.naam.localeCompare(b.naam,'nl');
const metVakgroep=n=>gebruikers.filter(g=>g.vakgroepen.some(v=>v.naam===n));
const mijnVakgroepen=()=>beheer?vakgroepen:vakgroepen.filter(n=>Aanmelding.magVakgroep(n,true));
const zoek=id=>gebruikers.find(g=>g.id===id);

async function bewaarGebruiker(g,wijziging){
 try{const nieuw=await api('PUT','gebruikers/'+encodeURIComponent(g.id),wijziging);gebruikers[gebruikers.indexOf(g)]=nieuw;bewaard()}
 catch(e){status('Niet bewaard: '+e.message)}
}

/* ===== MODULE 3: TEKENEN =====
   Eerst het vaste deel (keuze van de vakgroep), daarna de leden.
   Eén vakgroep = vaste tekst; meer vakgroepen = een zoekvak met keuzelijst. */
const app=document.getElementById('app');
function teken(){
 const mijne=mijnVakgroepen();
 if(!mijne.includes(keuze))keuze=mijne.length===1?mijne[0]:'';
 app.innerHTML=`<section class="card"><h2>Leden van je vakgroep</h2>
  <p class="mut">${beheer?'Kies een vakgroep en beheer wie erbij hoort en wie er vakgroephoofd is.':'Typ een naam om een leraar toe te voegen. Met × koppel je iemand los.'}</p>
  ${mijne.length>1?`<label for="kiesVakgroep">Vakgroep</label>
  <input type="text" id="kiesVakgroep" list="vakgroepLijst" value="${esc(keuze)}" placeholder="Zoek een vakgroep" autocomplete="off">
  <datalist id="vakgroepLijst">${mijne.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`
  :mijne.length?'':`<p class="mut">${beheer?'Er zijn nog geen vakgroepen. Maak ze aan op de pagina Gebruikersbeheer.':'Je bent van geen enkele vakgroep vakgroephoofd.'}</p>`}
  <div id="leden"></div></section>`;
 vulLeden();
}
function vulLeden(){
 const doos=document.getElementById('leden');
 if(!keuze){doos.innerHTML=mijnVakgroepen().length?'<p class="mut" style="margin-top:12px">Kies een vakgroep uit de lijst.</p>':'';return}
 const leden=metVakgroep(keuze).sort(opNaam);
 doos.innerHTML=`<h3 style="margin:16px 0 4px">${esc(keuze)} (${leden.length})</h3>
  ${leden.length?'':'<p class="mut">Nog niemand gekoppeld.</p>'}
  ${leden.map(g=>{const hoofd=g.vakgroepen.find(v=>v.naam===keuze).hoofd;
   return `<div class="lid"><span class="nm2">${esc(g.naam)} <span class="rol">· ${esc(g.rolNaam)}</span></span>
    ${beheer?`<label><input type="checkbox" data-hoofd="${esc(g.id)}" ${hoofd?'checked':''}>hoofd</label>`:hoofd?'<span class="rol">vakgroephoofd</span>':''}
    ${beheer||!hoofd?`<button type="button" class="x2" data-los="${esc(g.id)}" title="Loskoppelen van ${esc(keuze)}" aria-label="${esc(g.naam)} loskoppelen">×</button>`:''}</div>`}).join('')}
  <label for="lidZoek">Leraar toevoegen</label>
  <input type="text" id="lidZoek" placeholder="Typ een naam" autocomplete="off"><div id="suggesties"></div>`;
}
function vulSuggesties(){
 const q=document.getElementById('lidZoek').value.trim().toLowerCase();
 const doos=document.getElementById('suggesties');
 if(!q){doos.innerHTML='';return}
 const lijst=gebruikers.filter(g=>g.naam.toLowerCase().includes(q)&&!g.vakgroepen.some(v=>v.naam===keuze)).sort(opNaam).slice(0,8);
 doos.innerHTML=`<div class="sug">${lijst.length?lijst.map(g=>`<button type="button" data-voeg="${esc(g.id)}">${esc(g.naam)} <span class="rol">· ${esc(g.rolNaam)}</span></button>`).join(''):'<p>Niemand gevonden.</p>'}</div>`;
}
async function voegToe(g){
 await bewaarGebruiker(g,{vakgroepen:[...g.vakgroepen,{naam:keuze}]});
 vulLeden();document.getElementById('lidZoek').focus();
}

/* ===== MODULE 4: KLIKKEN EN TYPEN ===== */
app.addEventListener('click',async e=>{
 const el=e.target.closest('button');if(!el)return;const d=el.dataset;
 if(d.voeg)await voegToe(zoek(d.voeg));
 else if(d.los){const g=zoek(d.los);await bewaarGebruiker(g,{vakgroepen:g.vakgroepen.filter(v=>v.naam!==keuze)});vulLeden()}
});
app.addEventListener('change',async e=>{
 const d=e.target.dataset;
 if(d.hoofd){const g=zoek(d.hoofd);await bewaarGebruiker(g,{vakgroepen:g.vakgroepen.map(v=>v.naam===keuze?{naam:v.naam,hoofd:e.target.checked}:v)});vulLeden()}
});
app.addEventListener('input',e=>{
 const id=e.target.id,v=e.target.value;
 if(id==='kiesVakgroep'){const n=mijnVakgroepen().find(x=>x.toLowerCase()===v.trim().toLowerCase())||'';if(n!==keuze){keuze=n;vulLeden()}}
 else if(id==='lidZoek')vulSuggesties();
});
app.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='lidZoek'){e.preventDefault();const b=document.querySelector('[data-voeg]');if(b)b.click()}
});

/* ===== START ===== */
Aanmelding.klaar.then(async ik=>{
 if(!ik)return;
 beheer=Aanmelding.mag('gebruikers-beheer');
 try{[gebruikers,vakgroepen]=await Promise.all([api('GET','gebruikers'),api('GET','vakgroepen')])}
 catch(e){status('Niet geladen: '+e.message);return}
 teken();
});

/* ===== HUISSTIJL: AFBEELDINGEN =====
   De tekeningen staan als aparte SVG-bestanden naast deze html (map afbeeldingen/, naast de map apps/).
   Een lege alt ("") = decoratieve afbeelding (verborgen voor schermlezers). */
const AFBEELDINGEN={
 logo:   {src:'../afbeeldingen/logo.svg',    alt:'KSOM Campus Sint-Paulus – Klaar voor de toekomst!'},
 paul:   {src:'../afbeeldingen/paul.svg',    alt:''},
 paulien:{src:'../afbeeldingen/paulien.svg', alt:''}
};
function laadAfbeeldingen(){
 document.querySelectorAll('[data-afbeelding]').forEach(el=>{
  const a=AFBEELDINGEN[el.dataset.afbeelding];
  if(!a)return;
  const img=new Image();
  img.src=a.src;img.alt=a.alt;img.decoding='async';
  if(!a.alt)img.setAttribute('aria-hidden','true');
  el.appendChild(img);
 });
}
/* ===== HUISSTIJL: TEKST OP 1 LIJN =====
   Is het lettertype op een toestel breder dan verwacht, dan verkleint deze functie titel en ondertitel
   samen net genoeg (--fit) zodat ze op 1 lijn blijven. */
function pasTekstAan(){
 const txt=document.querySelector('.txt');
 txt.style.removeProperty('--fit');
 const cs=getComputedStyle(txt),beschikbaar=txt.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
 const breedte=el=>{const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width};
 const nodig=Math.max(...[...txt.children].map(breedte));
 if(nodig>beschikbaar)txt.style.setProperty('--fit',(beschikbaar/nodig*0.98).toFixed(3));
}
laadAfbeeldingen();
pasTekstAan();
new ResizeObserver(pasTekstAan).observe(document.querySelector('.hero'));
if(document.fonts)document.fonts.ready.then(pasTekstAan);
</script></body></html>
