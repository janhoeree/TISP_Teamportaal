<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tegel Code Generator</title>
    <style>
        :root {
            --teal: #008080;
            --g: #2bc473;
            --o: #ff9f43;
            --b: #0abde3;
            --r: #ee5253;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; color: #2c3e50; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .emoji-container {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px;
            background: #fafafa;
            margin-bottom: 10px;
        }
        .emoji-category {
            font-size: 12px;
            font-weight: bold;
            color: #7f8c8d;
            margin: 10px 0 5px 0;
        }
        .emoji-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .emoji-btn {
            font-size: 20px;
            background: none;
            border: 1px solid transparent;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .emoji-btn:hover {
            background-color: #e0e0e0;
            border-color: #bbb;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: normal;
        }
        .checkbox-label input {
            width: 18px;
            height: 18px;
        }
        button.generate-btn {
            background-color: #2bc473;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button.generate-btn:hover { background-color: #24a862; }
        .output-box {
            margin-top: 25px;
            background: #2d3436;
            color: #00ff88;
            padding: 15px;
            border-radius: 6px;
            font-family: "Courier New", Courier, monospace;
            white-space: pre-wrap;
            word-break: break-all;
            position: relative;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #4e5557;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .copy-btn:hover { background: #636e72; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tegel Lijn Generator</h2>
    
    <!-- n: Naam -->
    <div class="form-group">
        <label for="tile-name">n — Naam van de tegel:</label>
        <input type="text" id="tile-name" placeholder="Bijv. Ik wil ook een tegel">
    </div>

    <!-- i: Emoji Kiezer -->
    <div class="form-group">
        <label for="tile-emoji">i — Emoji (Kies hieronder of voer zelf in):</label>
        <input type="text" id="tile-emoji" placeholder="➕" style="width: 80px; text-align: center; font-size: 20px; margin-bottom: 10px;">
        
        <div class="emoji-container">
            <div class="emoji-category">Smileys & Gezichten</div>
            <div class="emoji-grid" data-emojis="😀,😃,😄,😁,😆,😅,😂,🤣,😊,😇,🙂,🙃,😉,😌,😍,🥰,😘,😗,😙,😚,😋,😛,😝,😜,🤪,🤨,🧐,🤓,😎,🥸,🤩,🥳,😏,😒,😞,😔,😟,😕,🙁,☹"></div>
            
            <div class="emoji-category">Kantoor & Documenten</div>
            <div class="emoji-grid" data-emojis="📊,📈,📉,📜,📋,📅,📆,🗓,📇,🗃,🗂,📁,📂,🗄,💼,📝,✍,📯,📥,📤,📦,🏷,✉,📩,📨,📧,📮,✏"></div>
            
            <div class="emoji-category">Gereedschap & Systeem</div>
            <div class="emoji-grid" data-emojis="⚙,🛠,🔧,🔨,⛏,🔩,🧱,⛓,🧲,🔌,🔋,💻,🖥,🖨,⌨,🖱,🎛,🎚,📺,📷,📸,📹,🎥,📽,💡,🔦,🏮,📔,📕,➕"></div>
            
            <div class="emoji-category">Communicatie & Waarschuwingen</div>
            <div class="emoji-grid" data-emojis="🔔,🔕,📣,📢,💬,💭,🗯,🗣,🎙,🎵,🎶,⚠,🛑,🚫,❌,⭕,💯,ℹ,❓,❔,❕,❗,🌐,🔒,🔓,🔏,🔐,🔑,🗝,🔍"></div>
        </div>
    </div>

    <!-- t: Omschrijving -->
    <div class="form-group">
        <label for="tile-desc">t — Omschrijving:</label>
        <input type="text" id="tile-desc" placeholder="Bijv. Heb je een idee voor een nieuwe toepassing?">
    </div>

    <!-- c: Kleur -->
    <div class="form-group">
        <label for="tile-color">c — Kleur:</label>
        <select id="tile-color">
            <option value="--teal">--teal (Teal)</option>
            <option value="--g">--g (Groen)</option>
            <option value="--o">--o (Oranje)</option>
            <option value="--b">--b (Blauw)</option>
            <option value="--r">--r (Rood)</option>
        </select>
    </div>

    <!-- nw: Gestippelde rand / Nieuw -->
    <div class="form-group">
        <label class="checkbox-label">
            <input type="checkbox" id="tile-nw" checked>
            <strong>nw</strong> — Meenemen in de regel (gestippelde rand inschakelen)
        </label>
    </div>

    <!-- href: Bestandsnaam -->
    <div class="form-group">
        <label for="tile-href">href — Bestandsnaam doelpagina:</label>
        <input type="text" id="tile-href" placeholder="Bijv. vakgroepcompas.html">
    </div>

    <button class="generate-btn" onclick="generateLine()">Tegelreferentie aanmaken</button>

    <div class="output-box" id="output-container" style="display: none;">
        <button class="copy-btn" onclick="copyToClipboard()">Kopieer</button>
        <span id="output-text"></span>
    </div>
</div>

<script>
    // Genereer de emoji grids dynamisch op basis van de data-attributes
    document.querySelectorAll('.emoji-grid').forEach(grid => {
        const emojis = grid.getAttribute('data-emojis').split(',');
        emojis.forEach(emoji => {
            const btn = document.createElement('button');
            btn.className = 'emoji-btn';
            btn.textContent = emoji;
            btn.type = 'button';
            btn.onclick = () => {
                document.getElementById('tile-emoji').value = emoji;
            };
            grid.appendChild(btn);
        });
    });

    // Functie om de output string te bouwen
    function generateLine() {
        const n = document.getElementById('tile-name').value.replace(/'/g, "\\'");
        const i = document.getElementById('tile-emoji').value.replace(/'/g, "\\'");
        const t = document.getElementById('tile-desc').value.replace(/'/g, "\\'");
        const c = document.getElementById('tile-color').value;
        const nw = document.getElementById('tile-nw').checked ? 1 : 0;
        const href = document.getElementById('tile-href').value.replace(/'/g, "\\'");

        // Bouw exact het format op zoals gevraagd
        const result = `{n:'${n}',i:'${i}',t:'${t}',c:'${c}',nw:${nw},href:'${href}'}`;

        document.getElementById('output-text').textContent = result;
        document.getElementById('output-container').style.display = 'block';
    }

    // Handige functie om direct de code te kopiëren
    function copyToClipboard() {
        const text = document.getElementById('output-text').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.textContent = 'Gekopieerd!';
            setTimeout(() => { copyBtn.textContent = 'Kopieer'; }, 2000);
        }).catch(err => {
            alert('Kopiëren mislukt, selecteer de tekst handmatig.');
        });
    }
</script>

</body>
</html>
